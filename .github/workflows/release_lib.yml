name: generate platformio library

on:
  push:
    branches:
      - main
      - fix-ci
      # kms-vcu pins this branch's prerelease (see below) until it's merged
      - vcu-traction-pi

jobs:
  build:
    runs-on: ubuntu-latest  
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Test the generator and every vehicle's DBC
      run: nix develop -c pytest -q gen_tool

    - name: Run the nix app
      run: |
        git status 
        nix build .\#default
        
    - name: Upload the DBC file
      uses: actions/upload-artifact@v4
      with:
        name: dbc-file
        path: ./result/*.dbc

    - name: Upload every vehicle's DBC
      uses: actions/upload-artifact@v4
      with:
        name: vehicle-dbc-files
        path: ./result/vehicles/*.dbc

          
  generate-and-release-pio-lib:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mathbrook/ccoderdbc:main
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dbc-file
        path: /dbc

    - name: Generate code
      run: |
        mkdir -p /can_lib
        cd /app
        ./dbcc -s -o /can_lib /dbc/*.dbc
        mkdir -p /output
        echo "{\n\"name\": \"can_lib\",\n\"version\": \"1.0.1\",\n\"build\": {\n\t\"flags\": [\n\t\t\"-Iinc\",\n\t\t\"-Ilib\",\n\t\t\"-Iconf\"\n\t]\n}\n}" >> /can_lib/library.json
        tar -czvf /output/can_lib.tar.gz /can_lib

    - name: Download every vehicle's DBC
      uses: actions/download-artifact@v4
      with:
        name: vehicle-dbc-files
        path: /vehicle_dbc

    # can_lib_<vehicle>.tar.gz for each vehicle: the same library name and
    # API as can_lib (car.h, can_obj_car_h_t), so firmware picks a vehicle by
    # which one it depends on. dbcc names its output after the input file,
    # hence each one copied to car.dbc first
    - name: Generate code for each vehicle
      run: |
        mkdir -p /output/vehicles
        for dbc in /vehicle_dbc/car_*.dbc; do
          vehicle=$(basename "$dbc" .dbc); vehicle=${vehicle#car_}
          mkdir -p "/vehicle_src/$vehicle" "/vehicle_lib/$vehicle/can_lib"
          cp "$dbc" "/vehicle_src/$vehicle/car.dbc"
          (cd /app && ./dbcc -s -o "/vehicle_lib/$vehicle/can_lib" "/vehicle_src/$vehicle/car.dbc")
          cp /can_lib/library.json "/vehicle_lib/$vehicle/can_lib/"
          tar -czvf "/output/vehicles/can_lib_$vehicle.tar.gz" -C "/vehicle_lib/$vehicle" can_lib
          cp "$dbc" "/output/vehicles/ksu_can_$vehicle.dbc"
        done

    - name: Keep the vehicle libraries for the release
      uses: actions/upload-artifact@v4
      with:
        name: vehicle-libs
        path: /output/vehicles/*

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        # Branch builds are prereleases tagged with the branch, so nothing
        # picks them up as the latest
        tag_name: ${{ github.ref_name == 'vcu-traction-pi' && format('vcu-traction-pi-{0}', github.run_number) || github.run_number }}
        release_name: ${{ github.ref_name == 'vcu-traction-pi' && format('vcu-traction-pi {0} (branch build)', github.run_number) || format('Release {0}', github.run_number) }}
        draft: false
        prerelease: ${{ github.ref_name == 'vcu-traction-pi' }}

    - name: PIO release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: /output/can_lib.tar.gz
        asset_name: can_lib.tar.gz
        asset_content_type: application/zip

    - name: DBC release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: /dbc/car.dbc
        asset_name: ksu_can.dbc
        asset_content_type: text/plain


  release-vehicle-libs:
    needs: generate-and-release-pio-lib
    runs-on: ubuntu-latest
    steps:
    - name: Download the vehicle libraries
      uses: actions/download-artifact@v4
      with:
        name: vehicle-libs
        path: vehicles

    - name: Add them to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # the tag generate-and-release-pio-lib created
        TAG: ${{ github.ref_name == 'vcu-traction-pi' && format('vcu-traction-pi-{0}', github.run_number) || github.run_number }}
      run: gh release upload "$TAG" vehicles/* --repo "$GITHUB_REPOSITORY"


  generate-and-release-rust-lib:
    needs: build
    # It commits to the shared rust branch: not from a branch build
    if: github.ref_name != 'vcu-traction-pi'
    runs-on: ubuntu-latest

    steps:
    - name: Install dbc-codegen-cli
      run: cargo install dbc-codegen-cli --git https://github.com/oxibus/dbc-codegen --branch release-plz-2026-01-20T18-31-05Z

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: dbc-file
        path: ~/dbc

    - name: Checkout rust branch
      uses: actions/checkout@v4
      with:
        ref: 'rust'
    - run: |
        ~/.cargo/bin/dbc-codegen ~/dbc/*.dbc $GITHUB_WORKSPACE/src/

        # Note: the following account information will not work on GHES
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "generated"
        git push
